<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RouteTask — Global Travel Planner</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div id="app-shell">

  <aside id="sidebar" class="wl-sidebar">
    <div class="wl-logo">
      <i class="bi bi-send-fill"></i>
      <span>RouteTask</span>
    </div>

    <nav class="wl-nav">
      <p class="wl-nav-title">Main</p>
      <a href="#/dashboard" data-route="dashboard" class="wl-nav-link active"><i class="bi bi-house-door"></i> Dashboard</a>

      <p class="wl-nav-title">Explore</p>
      <a href="#/holidays" data-route="holidays" class="wl-nav-link"><i class="bi bi-calendar-check"></i> Holidays</a>
      <a href="#/events" data-route="events" class="wl-nav-link"><i class="bi bi-ticket-perforated"></i> Events</a>
      <a href="#/weather" data-route="weather" class="wl-nav-link"><i class="bi bi-cloud-sun"></i> Weather</a>
      <a href="#/long-weekends" data-route="long-weekends" class="wl-nav-link"><i class="bi bi-umbrella"></i> Long Weekends</a>

      <p class="wl-nav-title">Travel Tools</p>
      <a href="#/currency" data-route="currency" class="wl-nav-link"><i class="bi bi-cash-coin"></i> Currency</a>
      <a href="#/sun-times" data-route="sun-times" class="wl-nav-link"><i class="bi bi-brightness-alt-high"></i> Sun Times</a>

      <p class="wl-nav-title">Personal</p>
      <a href="#/plans" data-route="plans" class="wl-nav-link"><i class="bi bi-heart"></i> My Plans</a>
    </nav>

    <div class="wl-sidebar-footer">
      <i class="bi bi-person-fill"></i>
      <div class="wl-sidebar-footer-text">
        <strong>Traveler</strong>
        <span>Planning mode</span>
      </div>
    </div>
  </aside>

  <div class="wl-main">
    <header class="wl-topbar">
      <button id="mobile-menu-btn" class="wl-mobile-btn"><i class="bi bi-list"></i></button>
      <div class="flex-grow-1">
        <h1 id="page-title">Dashboard</h1>
        <p id="page-subtitle" class="mb-0">Welcome back! Ready to plan your next adventure?</p>
      </div>
      <div class="wl-clock"><i class="bi bi-clock"></i> <span id="current-datetime"></span></div>
    </header>

    <main id="view-container" class="wl-content"></main>
  </div>
</div>

<div id="loading-overlay" class="wl-loading-overlay d-none">
  <div class="text-center">
    <i class="bi bi-airplane-engines wl-plane-spin"></i>
    <p id="loading-overlay-text">Loading...</p>
  </div>
</div>

<div id="toast-container" class="wl-toast-container"></div>

<script type="module" src="js/App.js"></script>
</body>
</html>
